<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesos Rápidos</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
    h1 {
      font-size: 1.25rem;
      color: #111827;
      margin: 0 0 8px 0;
    }
    .btn {
      display: block;
      padding: 14px 20px;
      background-color: #005a9e;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background-color 0.2s ease;
    }
    .btn:active {
      background-color: #004578;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Selecciona una opción</h1>
    <a class="btn" href="URL_FORMULARIO_1" target="_blank" rel="noopener">Formulario 1</a>
    <a class="btn" href="URL_FORMULARIO_2" target="_blank" rel="noopener">Formulario 2</a>
    <a class="btn" href="URL_FORMULARIO_3" target="_blank" rel="noopener">Formulario 3</a>
  </div>
</body>
</html>
